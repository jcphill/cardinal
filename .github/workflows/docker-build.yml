name: Build Docker image

on:
  push:
    branches:
      - ci-test

# Cancel an in-flight build when a newer commit lands, rather than
# queuing redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cardinal
        uses: actions/checkout@v7

      # Not actions/checkout's submodules: option -- .gitmodules also
      # declares private INL submodules this runner has no credentials
      # for. get-dependencies.sh already knows the public-only subset.
      - name: Fetch public submodules
        run: ./scripts/get-dependencies.sh

      - name: Set build metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # idaholab/moose-dev tags "latest" with a matching date tag
      # (e.g. 2026.10.19); look that up via Docker Hub's API so it can
      # go in our own image tag below.
      - name: Resolve moose-dev date tag
        id: moosedev
        run: |
          tags_json=$(curl -sf "https://hub.docker.com/v2/repositories/idaholab/moose-dev/tags?page_size=20&ordering=last_updated")
          latest_digest=$(echo "$tags_json" | jq -r '.results[] | select(.name=="latest") | .digest')
          date_tag=$(echo "$tags_json" | jq -r --arg d "$latest_digest" \
            '[.results[] | select(.name != "latest" and .digest == $d)][0].name')
          echo "tag=$date_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Defaults to false; forces a fresh check of moose-dev:latest.
          pull: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cardinal:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cardinal:${{ github.ref_name }}-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}-moosedev-${{ steps.moosedev.outputs.tag }}
          # Persists the layer cache across runs (each run is a fresh VM).
          cache-from: type=gha
          cache-to: type=gha,mode=max
